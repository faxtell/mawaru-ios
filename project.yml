name: Mawaru
options:
  bundleIdPrefix: jp.mawaru
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.0.1
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Mawaru:
    type: application
    platform: iOS
    sources:
      - path: Mawaru
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mawaru.diary
        CODE_SIGN_ENTITLEMENTS: Mawaru/Mawaru.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 'まわる'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: '交換日記に写真を添付するために写真を選択します。'
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
