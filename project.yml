name: Mawaru
options:
  bundleIdPrefix: jp.mawaru
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.0.1
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Mawaru:
    type: application
    platform: iOS
    sources:
      - path: Mawaru
    info:
      path: Mawaru/Info.plist
      properties:
        CFBundleDisplayName: 'まわる'
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSPhotoLibraryUsageDescription: '交換日記に写真を添付するために写真を選択します。'
        NSLocalNetworkUsageDescription: '近くの人と交換日記を直接送受信するため、同じ場所にいる端末を探します。'
        NSBluetoothAlwaysUsageDescription: '近くの人と日記を交換するために、周辺の端末との接続に使用します。'
        NSBonjourServices:
          - '_mawaru-diary._tcp'
        UILaunchScreen: {}
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mawaru.diary
        CODE_SIGN_ENTITLEMENTS: Mawaru/Mawaru.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 'まわる'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: '交換日記に写真を添付するために写真を選択します。'
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
