name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate backend logic
        run: |
          node --check backend/functions/index.js
          node --test backend/functions/test/*.test.js

      - name: Use compatible Xcode for Firebase 13
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS device app without signing
        run: |
          set -euo pipefail
          xcodebuild -project Mawaru.xcodeproj \
            -scheme Mawaru \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Mawaru.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Mawaru.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/Mawaru-unsigned.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/dist/Mawaru-unsigned.ipa" | grep -F 'Payload/Mawaru.app/' | head -1
          shasum -a 256 "$GITHUB_WORKSPACE/dist/Mawaru-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawaru-unsigned-IPA
          path: dist/Mawaru-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
